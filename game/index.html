<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAWNLINE — Canyon Mail Run</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a120c;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #f5e9d5; }
  #view { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.65); }
  #hud-top { top: 10px; left: 0; right: 0; text-align: center; }
  #hud-mission { font-size: 15px; font-weight: 700; letter-spacing: .14em; }
  #hud-objective { font-size: 13px; opacity: .92; margin-top: 2px; }
  #hud-heading { top: 52px; left: 50%; transform: translateX(-50%); width: 340px; height: 26px;
    overflow: hidden; border-bottom: 1px solid rgba(245,233,213,.35); }
  #hud-heading-strip { position: absolute; white-space: nowrap; font-size: 12px; font-weight: 600; }
  #hud-speed { left: 14px; top: 38%; width: 74px; text-align: center; }
  #hud-alt { right: 14px; top: 38%; width: 74px; text-align: center; }
  .tape-label { font-size: 10px; letter-spacing: .2em; opacity: .85; }
  .tape-value { font-size: 30px; font-weight: 800; line-height: 1.05; }
  .tape-unit { font-size: 10px; opacity: .8; }
  #hud-gauges { left: 14px; bottom: 14px; width: 180px; }
  .gauge { margin-top: 6px; }
  .gauge .tape-label { display: flex; justify-content: space-between; }
  .bar { height: 8px; background: rgba(0,0,0,.45); border: 1px solid rgba(245,233,213,.4); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; transition: width .15s linear; }
  #bar-fuel > div { background: #ffb340; }
  #bar-damage > div { background: #e4572e; }
  #bar-throttle > div { background: #7fd08a; }
  #hud-right { right: 14px; bottom: 14px; text-align: right; font-size: 12px; line-height: 1.5; }
  #hud-banner { top: 34%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800;
    letter-spacing: .12em; opacity: 0; transition: opacity .3s; }
  #hud-banner small { display: block; font-size: 15px; font-weight: 600; letter-spacing: .08em; margin-top: 6px; }
  #hud-menu { top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(16,10,6,.55); pointer-events: auto; }
  #hud-menu h1 { font-size: 52px; letter-spacing: .3em; margin: 0 0 2px; font-weight: 800; }
  #hud-menu .sub { font-size: 15px; letter-spacing: .34em; opacity: .9; margin-bottom: 26px; }
  #hud-menu .sorties { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
  .sortie { pointer-events: auto; cursor: pointer; width: 190px; padding: 12px 14px; border: 1px solid rgba(245,233,213,.5);
    border-radius: 8px; background: rgba(30,20,12,.72); color: #f5e9d5; text-align: left; font: inherit; }
  .sortie:hover { border-color: #ffb340; }
  .sortie b { display: block; font-size: 14px; letter-spacing: .08em; margin-bottom: 4px; }
  .sortie span { font-size: 12px; opacity: .88; line-height: 1.45; display: block; }
  #hud-menu .keys { margin-top: 24px; font-size: 12.5px; opacity: .9; text-align: center; line-height: 1.7; }
  #hud-score { top: 10px; right: 14px; text-align: right; font-size: 13px; line-height: 1.5; }
  #hud-map { position: fixed; right: 14px; bottom: 96px; width: 168px; height: 168px;
    border-radius: 6px; opacity: .92; pointer-events: none; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud" id="hud-top">
  <div id="hud-mission">DAWNLINE</div>
  <div id="hud-objective"></div>
</div>
<div class="hud" id="hud-heading"><div id="hud-heading-strip"></div></div>
<div class="hud" id="hud-speed">
  <div class="tape-label">SPEED</div><div class="tape-value" id="hud-speed-value">0</div><div class="tape-unit">km/h</div>
</div>
<div class="hud" id="hud-alt">
  <div class="tape-label">ALTITUDE</div><div class="tape-value" id="hud-alt-value">0</div><div class="tape-unit">metres</div>
</div>
<div class="hud" id="hud-gauges">
  <div class="gauge"><div class="tape-label"><span>FUEL</span><span id="hud-fuel-value">100</span></div>
    <div class="bar" id="bar-fuel"><div style="width:100%"></div></div></div>
  <div class="gauge"><div class="tape-label"><span>DAMAGE</span><span id="hud-damage-value">0</span></div>
    <div class="bar" id="bar-damage"><div style="width:0%"></div></div></div>
  <div class="gauge"><div class="tape-label"><span>THROTTLE</span><span id="hud-throttle-value">0</span></div>
    <div class="bar" id="bar-throttle"><div style="width:0%"></div></div></div>
</div>
<div class="hud" id="hud-score"></div>
<canvas id="hud-map" width="168" height="168"></canvas>
<div class="hud" id="hud-right"></div>
<div class="hud" id="hud-banner"></div>

<div class="hud" id="hud-menu">
  <h1>DAWNLINE</h1>
  <div class="sub">CANYON MAIL RUN</div>
  <div class="sorties">
    <button class="sortie" data-sortie="rings"><b>1 · RING RUN</b><span>Thread eight rings down the canyon, in order, against the clock.</span></button>
    <button class="sortie" data-sortie="mail"><b>2 · MAIL DELIVERY</b><span>Take the mail from Dawn Strip to Mesa Strip, then bring the reply home.</span></button>
    <button class="sortie" data-sortie="rescue"><b>3 · RESCUE</b><span>A hiker is stranded at the beacon. Land beside them, then fly them out.</span></button>
    <button class="sortie" data-sortie="precision"><b>4 · PRECISION</b><span>Put it down inside the marked zone on Mesa Strip and stop before the end.</span></button>
  </div>
  <div class="keys">W/S throttle · ↑/↓ pitch · ←/→ or A/D bank · Space brake · C camera · R reset sortie<br>
  Lift needs speed. A banked wing turns and sinks. Fuel is finite — so is the airframe.</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
